<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login Karyawan - SI Absensi</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet">

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="login-page">

    <div class="login-wrapper">

        <div class="login-card">

            <!-- LOGO -->
            <div class="login-logo employee-logo">
                <i class="bi bi-person-badge"></i>
            </div>

            <h2>Login Karyawan</h2>

            <p class="login-subtitle">
                Masuk ke sistem absensi menggunakan akun pribadi Anda.
            </p>

            <!-- PESAN -->
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endwith %}

            <!-- FORM LOGIN -->
            <form method="POST">

                <div class="login-input">

                    <label>Username</label>

                    <div class="input-group">

                        <span class="input-group-text">
                            <i class="bi bi-person"></i>
                        </span>

                        <input
                            type="text"
                            name="username"
                            class="form-control"
                            placeholder="Masukkan username"
                            required>

                    </div>

                </div>


                <div class="login-input">

                    <label>Password</label>

                    <div class="input-group">

                        <span class="input-group-text">
                            <i class="bi bi-lock"></i>
                        </span>

                        <input
                            type="password"
                            name="password"
                            class="form-control"
                            placeholder="Masukkan password"
                            required>

                    </div>

                </div>


                <!-- TOMBOL LOGIN -->
                <button
                    type="submit"
                    class="btn-login employee-btn">

                    <i class="bi bi-box-arrow-in-right"></i>
                    Login sebagai Karyawan

                </button>

            </form>


            <!-- LINK REGISTRASI -->
            <div class="switch-login">

                Belum punya akun?

                <a href="{{ url_for('register_karyawan') }}">
                    Registrasi Karyawan
                </a>

            </div>


        </div>

    </div>

</body>
</html>
