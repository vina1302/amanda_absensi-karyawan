{% extends "layout.html" %}

{% block title %}
Tambah Karyawan - SI Absensi
{% endblock %}

{% block heading %}
Tambah Karyawan
{% endblock %}

{% block content %}

<div class="card-box">

    <div class="card-header-custom">

        <div>
            <h5>Tambah Karyawan</h5>
            <p>Masukkan data karyawan baru</p>
        </div>

        <a href="{{ url_for('karyawan') }}"
           class="btn btn-secondary">

            <i class="bi bi-arrow-left"></i>
            Kembali

        </a>

    </div>


    <form method="POST">

        <div class="row g-3">

            <!-- AKUN LOGIN -->

            <div class="col-12">

                <label class="form-label">
                    Akun Login Karyawan
                </label>

                <select
                    name="user_id"
                    class="form-select"
                    required
                >

                    <option value="">
                        -- Pilih Akun Karyawan --
                    </option>

                    {% for user in users %}

                        <option value="{{ user.id }}">

                            {{ user.nama }}
                            -
                            {{ user.username }}

                        </option>

                    {% endfor %}

                </select>

                <small class="text-muted">
                    Pilih akun login yang akan digunakan oleh karyawan ini.
                </small>

            </div>


            <!-- NAMA -->

            <div class="col-md-6">

                <label class="form-label">
                    Nama Karyawan
                </label>

                <input
                    type="text"
                    name="nama"
                    class="form-control"
                    placeholder="Masukkan nama karyawan"
                    required
                >

            </div>


            <!-- NIK -->

            <div class="col-md-6">

                <label class="form-label">
                    NIK
                </label>

                <input
                    type="text"
                    name="nik"
                    class="form-control"
                    placeholder="Masukkan NIK"
                    required
                >

            </div>


            <!-- JABATAN -->

            <div class="col-md-6">

                <label class="form-label">
                    Jabatan
                </label>

                <input
                    type="text"
                    name="jabatan"
                    class="form-control"
                    placeholder="Masukkan jabatan"
                    required
                >

            </div>


            <!-- NO HP -->

            <div class="col-md-6">

                <label class="form-label">
                    No. HP
                </label>

                <input
                    type="text"
                    name="no_hp"
                    class="form-control"
                    placeholder="Masukkan nomor HP"
                >

            </div>


            <!-- ALAMAT -->

            <div class="col-12">

                <label class="form-label">
                    Alamat
                </label>

                <textarea
                    name="alamat"
                    class="form-control"
                    rows="4"
                    placeholder="Masukkan alamat"
                ></textarea>

            </div>

        </div>


        <div class="mt-4">

            <button
                type="submit"
                class="btn btn-primary"
            >

                <i class="bi bi-save"></i>
                Simpan Karyawan

            </button>


            <a
                href="{{ url_for('karyawan') }}"
                class="btn btn-secondary"
            >

                Batal

            </a>

        </div>

    </form>

</div>

{% endblock %}
