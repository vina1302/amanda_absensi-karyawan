<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registrasi Karyawan - SI Absensi</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet">

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="login-page">

    <div class="login-wrapper">

        <div class="login-card">

            <!-- LOGO -->
            <div class="login-logo employee-logo">
                <i class="bi bi-person-plus"></i>
            </div>

            <h2>Registrasi Karyawan</h2>

            <p class="login-subtitle">
                Buat akun pribadi untuk mengakses sistem absensi.
            </p>

            <!-- PESAN -->
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endwith %}

            <!-- FORM REGISTRASI -->
            <form method="POST">

                <!-- NAMA -->
                <div class="login-input">

                    <label>Nama Lengkap</label>

                    <div class="input-group">

                        <span class="input-group-text">
                            <i class="bi bi-person"></i>
                        </span>

                        <input
                            type="text"
                            name="nama"
                            class="form-control"
                            placeholder="Masukkan nama lengkap"
                            required>

                    </div>

                </div>


                <!-- JABATAN -->
                <div class="login-input">

                    <label>Jabatan</label>

                    <div class="input-group">

                        <span class="input-group-text">
                            <i class="bi bi-briefcase"></i>
                        </span>

                        <input
                            type="text"
                            name="jabatan"
                            class="form-control"
                            placeholder="Masukkan jabatan"
                            required>

                    </div>

                </div>


                <!-- USERNAME -->
                <div class="login-input">

                    <label>Username</label>

                    <div class="input-group">

                        <span class="input-group-text">
                            <i class="bi bi-person-circle"></i>
                        </span>

                        <input
                            type="text"
                            name="username"
                            class="form-control"
                            placeholder="Buat username"
                            required>

                    </div>

                </div>


                <!-- PASSWORD -->
                <div class="login-input">

                    <label>Password</label>

                    <div class="input-group">

                        <span class="input-group-text">
                            <i class="bi bi-lock"></i>
                        </span>

                        <input
                            type="password"
                            name="password"
                            class="form-control"
                            placeholder="Buat password"
                            required>

                    </div>

                </div>


                <!-- KONFIRMASI PASSWORD -->
                <div class="login-input">

                    <label>Konfirmasi Password</label>

                    <div class="input-group">

                        <span class="input-group-text">
                            <i class="bi bi-lock-fill"></i>
                        </span>

                        <input
                            type="password"
                            name="konfirmasi_password"
                            class="form-control"
                            placeholder="Ulangi password"
                            required>

                    </div>

                </div>


                <!-- BUTTON -->
                <button
                    type="submit"
                    class="btn-login employee-btn">

                    <i class="bi bi-person-plus"></i>
                    Daftar Akun

                </button>

            </form>


            <!-- KEMBALI LOGIN -->
            <div class="switch-login">

                Sudah punya akun?

                <a href="{{ url_for('login_karyawan') }}">
                    Login Karyawan
                </a>

            </div>

        </div>

    </div>

</body>
</html>
