
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Selamat Datang - SI Absensi</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0C6AD4, #1E90FF, #C6E7FF);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .welcome-card {
            background: white;
            width: 100%;
            max-width: 850px;
            padding: 55px 35px;
            border-radius: 25px;
            text-align: center;
            box-shadow: 0 15px 45px rgba(0,0,0,0.15);
        }

        .logo-icon {
            width: 90px;
            height: 90px;
            background: #E8F3FF;
            color: #1E90FF;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 45px;
            margin: 0 auto 20px;
        }

        .company {
            color: #0C6AD4;
            font-weight: 700;
            font-size: 20px;
        }

        .welcome-title {
            font-size: 36px;
            font-weight: 800;
            color: #1E90FF;
            margin-top: 25px;
        }

        .description {
            color: #777;
            margin-top: 12px;
            line-height: 1.8;
        }

        .login-title {
            margin-top: 35px;
            margin-bottom: 20px;
            font-weight: 600;
            color: #333;
        }

        .login-btn {
            display: block;
            text-decoration: none;
            padding: 18px;
            border-radius: 14px;
            color: white;
            background: #1E90FF;
            font-weight: 600;
            transition: 0.3s;
        }

        .login-btn:hover {
            background: #0C6AD4;
            color: white;
            transform: translateY(-3px);
        }

        .login-btn i {
            font-size: 25px;
            display: block;
            margin-bottom: 8px;
        }

        .footer {
            margin-top: 35px;
            font-size: 12px;
            color: #999;
        }

        @media (max-width: 576px) {
            .welcome-card {
                padding: 35px 20px;
            }

            .welcome-title {
                font-size: 27px;
            }

            .company {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

    <div class="welcome-card">

        <div class="logo-icon">
            <i class="bi bi-fingerprint"></i>
        </div>

        <div class="company">
            PTPN IV REGIONAL VI
        </div>

        <div class="company">
            PKS PULAU TIGA
        </div>

        <h1 class="welcome-title">
            SELAMAT DATANG
        </h1>

        <p class="description">
            Di Sistem Informasi Absensi dan Kehadiran Karyawan
            <br>
            PKS Pulau Tiga
        </p>

        <h5 class="login-title">
            Silakan pilih jenis login
        </h5>

        <div class="row g-3">

            <div class="col-md-6">
                <a href="{{ url_for('login_admin') }}"
                   class="login-btn">
                    <i class="bi bi-shield-lock"></i>
                    Login Admin
                </a>
            </div>

            <div class="col-md-6">
                <a href="{{ url_for('login_karyawan') }}"
                   class="login-btn">
                    <i class="bi bi-person-badge"></i>
                    Login Karyawan
                </a>
            </div>

        </div>

        <div class="footer">
            © 2026 Sistem Informasi Absensi Karyawan
        </div>

    </div>

</body>
</html>
